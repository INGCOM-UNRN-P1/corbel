[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corbel"
version = "0.1.0"
description = "Generador liviano de documentación de APIs, TDAs y man pages (man 3) en C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
corbel = "corbel.cli:app"

[project.entry-points."ripley.plugins"]
documentation = "corbel.plugins.ripley_plugin:CorbelPlugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
